<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC 本地页面</title>
    <style>
      body { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; margin:0; padding:16px; background:#f7f7f9; }
      body.flow-active { padding-top: 96px; }
      .container { max-width: 720px; margin: 0 auto; }
      .card { background:#fff; border-radius:12px; padding:16px; box-shadow:0 2px 10px rgba(0,0,0,.06); margin-bottom:16px; }
      .title { font-size:18px; font-weight:600; margin-bottom:12px; }
      .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
      .btn { padding:10px 14px; border:0; border-radius:8px; background:#007bff; color:#fff; cursor:pointer; font-size:14px; }
      .btn.warn { background:#ffc107; color:#333; }
      .btn.success { background:#28a745; }
      .btn.secondary { background:#6c757d; }
      .btn.ghost { background:#e9ecef; color:#333; }
      .status { padding:8px 10px; background:#f8f9fa; border:1px solid #eee; border-radius:8px; font-size:13px; color:#333; }
      .badge { display:inline-block; padding:4px 8px; border-radius:999px; font-size:12px; margin-left:8px; }
      .badge.ok { background:#d1fae5; color:#065f46; }
      .badge.err { background:#fee2e2; color:#991b1b; }
      .progress-wrap { margin-top:12px; }
      .progress-label { font-size:12px; color:#555; margin-bottom:6px; }
      .progress-bar { width:100%; height:10px; background:#e9ecef; border-radius:999px; overflow:hidden; }
      .progress-fill { height:100%; width:0%; background:#007bff; transition:width .25s ease; }
      .flow-banner { position:fixed; left:12px; right:12px; top:12px; z-index:9999; background:#ffeb3b; border:1px solid #d4b200; border-radius:12px; box-shadow:0 8px 20px rgba(0,0,0,.12); padding:10px 12px; display:none; }
      .flow-banner.show { display:block; }
      .flow-row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
      .flow-text { font-size:13px; color:#111; }
      .flow-ok { background:#16a34a; color:#fff; border:0; border-radius:8px; padding:7px 12px; font-size:12px; cursor:pointer; display:none; }
      .timing-grid { display:block; }
      .timing-item { background:#f8f9fa; border:1px solid #eee; border-radius:10px; padding:18px; text-align:center; }
      .timing-value { font-size:28px; font-weight:700; color:#007bff; line-height:1.2; }
      .timing-label { font-size:12px; color:#666; margin-top:6px; }
      .timing-hint { margin-top:12px; font-size:12px; color:#888; line-height:1.5; }
      .log-card-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
      .log-card-head .title { margin-bottom:0; }
      .log-actions { display:flex; gap:8px; }
      .log { background:#0f172a; color:#e2e8f0; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; padding:12px; border-radius:8px; max-height:260px; overflow:auto; }
      .log.collapsed { display:none; }
    </style>
    <script src="../cordova.js"></script>
    <script src="../cordova_plugins.js"></script>
    <script>
      function formatLogTime(){
        const d=new Date();
        const p=(n)=>String(n).padStart(2,'0');
        const ms=String(d.getMilliseconds()).padStart(3,'0');
        return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}.${ms}`;
      }

      function log(msg, type='info'){
        const el=document.getElementById('log');
        if(!el) return;
        const line=document.createElement('div');
        line.textContent=`[${formatLogTime()}] ${msg}`;
        if(type==='error') line.style.color='#fca5a5';
        if(type==='success') line.style.color='#86efac';
        el.appendChild(line);
        el.scrollTop=el.scrollHeight;
        console.log(msg);
      }

      function clearLog(){
        const el=document.getElementById('log');
        if(el){ el.innerHTML=''; }
        log('日志已清空');
      }

      function toggleLogCollapse(){
        const el=document.getElementById('log');
        const btn=document.getElementById('logToggleBtn');
        if(!el || !btn) return;
        const collapsed=el.classList.toggle('collapsed');
        btn.textContent=collapsed ? '展开' : '折叠';
      }

      let isReady=false, isPluginInitialized=false;
      let latestLockState = null;
      let autoRunning = false;
      let autoProgressTotal = 4;
      let latestLockId = '';
      let latestLockPassword = '';
      let autoFlowStartMs = 0;
      let manualLockStartMs = 0;

      function setAutoProgress(step, text, isError){
        const safeStep = Math.max(0, Math.min(step, autoProgressTotal));
        const percent = Math.round((safeStep / autoProgressTotal) * 100);
        const fill = document.getElementById('autoProgressFill');
        const label = document.getElementById('autoProgressText');
        if(fill){ fill.style.width = percent + '%'; fill.style.background = isError ? '#dc3545' : '#007bff'; }
        if(label){ label.textContent = (text || '待开始') + '（' + percent + '%）'; }
        if(text){ updateFlowBanner(text, isError ? 'error' : 'running', false); }
      }

      function formatElapsedSec(ms){
        return (Math.round(ms / 100) / 10).toFixed(1);
      }

      function updateTimingUI(elapsedMs, actionLabel){
        const lastEl = document.getElementById('lastElapsedSec');
        const actionEl = document.getElementById('lastFlowAction');
        if(!lastEl) return;
        if(typeof elapsedMs === 'number' && elapsedMs >= 0){
          lastEl.textContent = formatElapsedSec(elapsedMs);
          if(actionEl && actionLabel){ actionEl.textContent = actionLabel; }
        }
      }

      document.addEventListener('deviceready', function(){
        isReady=true;
        log('deviceready');
        const env=document.getElementById('env');
        if(env){ env.textContent='已就绪'; env.className='badge ok'; }
      }, false);

      function ensureReady(){
        if(!isReady){ log('设备未就绪，请等待 deviceready', 'error'); return false; }
        if(typeof cordova==='undefined'){ log('cordova 未注入（cordova.js 未加载成功）', 'error'); return false; }
        if(!cordova.plugins || !cordova.plugins.NFCLockPlugin){ log('NFCLockPlugin 未找到（检查 cordova_plugins.js 与 plugins 目录）', 'error'); return false; }
        return true;
      }

      function initPlugin(){
        if(!ensureReady()) return;
        log('初始化插件...');
        cordova.plugins.NFCLockPlugin.init(function(res){
          isPluginInitialized=true;
          document.getElementById('plugin').textContent='已初始化';
          document.getElementById('plugin').className='badge ok';
          log('插件初始化成功: '+res, 'success');
          registerCallback();
        }, function(err){
          document.getElementById('plugin').textContent='失败';
          document.getElementById('plugin').className='badge err';
          log('插件初始化失败: '+err, 'error');
        });
      }

      function registerCallback(){
        cordova.plugins.NFCLockPlugin.registerCallback(function(result){
          log('收到回调: '+JSON.stringify(result));
          if(result && result.type==='autoFlowProgress'){
            const step = Number(result.step || 0);
            const msg = result.message || '自动流程进行中';
            setAutoProgress(step, msg, result.status === 'error');
            return;
          }
          if(result && result.type==='autoFlowComplete'){
            autoRunning = false;
            const elapsedMs = typeof result.elapsedMs === 'number'
              ? result.elapsedMs
              : (autoFlowStartMs ? Date.now() - autoFlowStartMs : -1);

            if(result.success){
              if(result.lockId){ latestLockId = String(result.lockId); }
              if(result.lockPassword){ latestLockPassword = String(result.lockPassword); }
              if(result.motorAction === 'open'){
                latestLockState = '0';
                setUnlockStatus('已开锁', '#16a34a');
              } else if(result.motorAction === 'close'){
                latestLockState = '2';
                setUnlockStatus('已关锁', '#16a34a');
              }
              if(elapsedMs >= 0){
                updateTimingUI(elapsedMs, result.motorAction === 'close' ? '自动关锁' : '自动开锁');
                log('自动流程完成，耗时 ' + formatElapsedSec(elapsedMs) + ' 秒', 'success');
              } else {
                log('自动流程完成', 'success');
              }
              setAutoProgress(4, '自动流程完成', false);
              resetPowerUIToZero();
              updateFlowBanner('开锁/关锁流程已完成，请点击确认。', 'success', true);
            } else {
              log('自动流程失败: ' + (result.message || '未知错误'), 'error');
              setAutoProgress(0, '自动流程失败', true);
              updateFlowBanner(result.message || '请重新尝试自动开锁或关锁。', 'error', true);
            }
            return;
          }
          if(result && result.type==='manualFlowComplete'){
            manualLockStartMs = 0;
            const elapsedMs = typeof result.elapsedMs === 'number' ? result.elapsedMs : -1;
            if(result.success){
              if(result.lockId){ latestLockId = String(result.lockId); }
              if(result.lockPassword){ latestLockPassword = String(result.lockPassword); }
              if(result.motorAction === 'open'){
                latestLockState = '0';
                setUnlockStatus('已开锁', '#16a34a');
              } else if(result.motorAction === 'close'){
                latestLockState = '2';
                setUnlockStatus('已关锁', '#16a34a');
              }
              if(elapsedMs >= 0){
                updateTimingUI(elapsedMs, result.motorAction === 'close' ? '手动关锁' : '手动开锁');
                log('手动流程完成，耗时 ' + formatElapsedSec(elapsedMs) + ' 秒（使用缓存密码）', 'success');
              } else {
                log('手动流程完成', 'success');
              }
              resetPowerUIToZero();
            } else {
              log('手动流程失败: ' + (result.message || '未知错误'), 'error');
            }
            return;
          }
          if(result && result.type==='manualFlowProgress'){
            log(result.message || '手动流程进行中');
            return;
          }

          if(result && result.lockId){
            const id = String(result.lockId).trim();
            if(id){ latestLockId = id; }
          }
          if(result && result.lockPassword){
            latestLockPassword = String(result.lockPassword).trim();
          }
          if(result && result.type==='queryPowerLevel' && result.powerLevel!=null){
            const p=document.getElementById('powerLevel');
            if(p){ p.textContent = result.powerLevel + '%'; }
            latestLockState = result.lockState;
            updateLockStateCodeUI(result.lockState);
            updateLockStateUI(parseLockState(result.lockState));
            log('当前电量: '+ result.powerLevel + '%', 'success');
          }
          if(result && (result.type==='motorForward' || result.motorForwardSuccess!==undefined)){
            setUnlockStatus(result.motorForwardSuccess ? '已开锁' : '开锁失败', result.motorForwardSuccess ? '#16a34a' : '#dc2626');
            if(result.motorForwardSuccess){
              latestLockState = '0';
              resetPowerUIToZero();
            }
          }
          if(result && (result.type==='motorReverse' || result.motorReverseSuccess!==undefined)){
            setUnlockStatus(result.motorReverseSuccess ? '已关锁' : '关锁失败', result.motorReverseSuccess ? '#16a34a' : '#dc2626');
            if(result.motorReverseSuccess){
              latestLockState = '2';
              resetPowerUIToZero();
            }
          }
        }, function(error){ log('回调错误: '+JSON.stringify(error), 'error'); });
      }

      function setUnlockStatus(text, color){
        const statusEl = document.getElementById('unlockStatus');
        if(statusEl){
          statusEl.textContent = text;
          statusEl.style.color = color;
        }
      }

      function openLock(){
        if(!ensureReady()||!isPluginInitialized){ log('请先初始化插件', 'error'); return; }
        const api = cordova.plugins.NFCLockPlugin.manualOpenLock
          ? cordova.plugins.NFCLockPlugin.manualOpenLock.bind(cordova.plugins.NFCLockPlugin)
          : function(ok, err){ cordova.exec(ok, err, 'NFCLockPlugin', 'manualOpenLock', []); };
        manualLockStartMs = Date.now();
        log('手动开锁：查询锁ID并使用缓存密码...');
        api(
          function(res){ log('手动开锁已启动: ' + res, 'success'); },
          function(err){
            manualLockStartMs = 0;
            log('手动开锁失败: ' + err, 'error');
          }
        );
      }

      function closeLock(){
        if(!ensureReady()||!isPluginInitialized){ log('请先初始化插件', 'error'); return; }
        const api = cordova.plugins.NFCLockPlugin.manualCloseLock
          ? cordova.plugins.NFCLockPlugin.manualCloseLock.bind(cordova.plugins.NFCLockPlugin)
          : function(ok, err){ cordova.exec(ok, err, 'NFCLockPlugin', 'manualCloseLock', []); };
        manualLockStartMs = Date.now();
        log('手动关锁：查询锁ID并使用缓存密码...');
        api(
          function(res){ log('手动关锁已启动: ' + res, 'success'); },
          function(err){
            manualLockStartMs = 0;
            log('手动关锁失败: ' + err, 'error');
          }
        );
      }

      function parseLockState(state){
        if(state===null || state===undefined) return 'unknown';
        const raw = String(state).toLowerCase();
        if(raw==='2' || raw==='open' || raw==='opened' || raw==='unlock' || raw==='unlocked' || raw.includes('开')) return 'opened';
        if(raw==='0' || raw==='1' || raw==='close' || raw==='closed' || raw==='lock' || raw==='locked' || raw.includes('关')) return 'closed';
        return 'unknown';
      }

      function updateLockStateUI(state){
        if(state === 'opened'){ setUnlockStatus('已开锁', '#16a34a'); }
        else if(state === 'closed'){ setUnlockStatus('已关锁', '#16a34a'); }
      }

      function updateLockStateCodeUI(code){
        const codeEl = document.getElementById('lockStateCode');
        if(codeEl){ codeEl.textContent = code == null ? '-' : String(code); }
      }

      function resetPowerUIToZero(){
        const p = document.getElementById('powerLevel');
        if(p){ p.textContent = '0%'; }
      }

      function updateFlowBanner(message, status, showConfirm){
        const banner = document.getElementById('flowBanner');
        const text = document.getElementById('flowBannerText');
        const ok = document.getElementById('flowBannerOk');
        if(!banner || !text || !ok) return;
        banner.classList.add('show');
        document.body.classList.add('flow-active');
        banner.classList.remove('running', 'success', 'error');
        banner.classList.add(status || 'running');
        text.textContent = message || '';
        ok.style.display = showConfirm ? 'inline-block' : 'none';
      }

      function hideFlowBanner(){
        const banner = document.getElementById('flowBanner');
        if(banner){ banner.classList.remove('show', 'running', 'success', 'error'); }
        document.body.classList.remove('flow-active');
      }

      async function autoToggleLock(){
        if(autoRunning){ log('自动流程执行中，请稍后', 'error'); return; }
        if(!ensureReady() || !isPluginInitialized){ log('请先初始化插件', 'error'); return; }
        autoRunning = true;
        autoFlowStartMs = Date.now();
        updateFlowBanner('自动开锁或关锁流程开始，请将手机贴在锁上并保持。', 'running', false);
        setAutoProgress(0, '自动流程开始', false);
        log('开始原生自动流程：一次贴卡串联 ID -> 密码 -> 状态 -> 充电 -> 电机');
        const startAuto = cordova.plugins.NFCLockPlugin.autoToggleLock
          ? cordova.plugins.NFCLockPlugin.autoToggleLock.bind(cordova.plugins.NFCLockPlugin)
          : function(success, error){ cordova.exec(success, error, 'NFCLockPlugin', 'autoToggleLock', []); };
        startAuto(
          function(res){ log('自动流程已启动: ' + res, 'success'); },
          function(err){
            autoRunning = false;
            log('自动流程启动失败: ' + err, 'error');
            setAutoProgress(0, '自动流程失败', true);
            updateFlowBanner('流程执行中断，请重新尝试自动开锁或关锁。', 'error', true);
          }
        );
      }
    </script>
  </head>
  <body>
    <div id="flowBanner" class="flow-banner">
      <div class="flow-row">
        <div id="flowBannerText" class="flow-text">自动流程状态</div>
        <button id="flowBannerOk" class="flow-ok" onclick="hideFlowBanner()">确认完成</button>
      </div>
    </div>
    <div class="container">
      <div class="card">
        <div class="title">环境状态</div>
        <div>设备状态：<span id="env" class="badge err">未就绪</span></div>
        <div style="margin-top:8px;">插件状态：<span id="plugin" class="badge err">未初始化</span></div>
        <div style="margin-top:12px;" class="row">
          <button class="btn" onclick="initPlugin()">初始化插件</button>
        </div>
      </div>

      <div class="card">
        <div class="title">流程耗时</div>
        <div class="timing-grid">
          <div class="timing-item">
            <div id="lastElapsedSec" class="timing-value">-</div>
            <div class="timing-label">最近一次耗时（秒）</div>
            <div id="lastFlowAction" class="timing-hint" style="margin-top:8px;">-</div>
          </div>
        </div>
        <div class="timing-hint">
          自动流程会缓存最新密码；手动开锁/关锁仅查询锁ID并使用缓存密码，速度更快。
        </div>
      </div>

      <div class="card">
        <div class="title">开关锁控制</div>
        <div class="row">
          <button class="btn success" onclick="openLock()">开锁</button>
          <button class="btn warn" onclick="closeLock()">关锁</button>
          <button class="btn" onclick="autoToggleLock()">自动开锁或关锁</button>
        </div>
        <div style="margin-top:12px;" class="status">状态：<span id="unlockStatus">-</span></div>
        <div style="margin-top:8px;" class="status">状态码：<span id="lockStateCode">-</span></div>
        <div style="margin-top:8px;" class="status">电量：<span id="powerLevel">-</span></div>
        <div class="progress-wrap">
          <div id="autoProgressText" class="progress-label">待开始（0%）</div>
          <div class="progress-bar"><div id="autoProgressFill" class="progress-fill"></div></div>
        </div>
      </div>

      <div class="card">
        <div class="log-card-head">
          <div class="title">调试日志</div>
          <div class="log-actions">
            <button id="logToggleBtn" class="btn ghost" onclick="toggleLogCollapse()">折叠</button>
            <button class="btn secondary" onclick="clearLog()">清空</button>
          </div>
        </div>
        <div id="log" class="log"></div>
      </div>
    </div>
  </body>
</html>
