<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>聚如信</title>
    <!-- Cordova 运行时（仅 APK 内由构建注入，浏览器直接打开无效） -->
    <script src="cordova.js"></script>
    <style>
      :root {
        --bg-top: #dceefb;
        --bg-bottom: #f4f9fd;
        --primary: #1a4d7a;
        --primary-light: #2d6a9f;
        --accent: #29b6f6;
        --accent-dark: #0288d1;
        --card-bg: #ffffff;
        --card-border: rgba(41, 182, 246, 0.18);
        --card-shadow: 0 4px 16px rgba(26, 77, 122, 0.08);
        --text-muted: #6b8aad;
        --success: #26a69a;
        --warn: #ffa726;
        --danger: #ef5350;
      }
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 280px, var(--bg-bottom) 100%);
        color: var(--primary);
      }
      .page { max-width: 720px; margin: 0 auto; padding: 16px 16px 28px; }

      .hero {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 4px 20px;
        min-height: 120px;
      }
      .hero-text { flex: 1; min-width: 0; }
      .welcome { margin: 0 0 4px; font-size: 14px; color: var(--text-muted); }
      .app-name {
        margin: 0;
        font-size: 26px;
        font-weight: 700;
        color: var(--primary);
        letter-spacing: 1px;
      }
      .app-sub { margin: 6px 0 10px; font-size: 13px; color: var(--primary-light); }
      .status-chips { display: flex; flex-wrap: wrap; gap: 8px; }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        background: rgba(255,255,255,.75);
        border: 1px solid var(--card-border);
        color: var(--primary-light);
      }
      .chip.ok { color: #0d7a6e; background: rgba(38,166,154,.12); border-color: rgba(38,166,154,.25); }
      .chip.err { color: #c62828; background: rgba(239,83,80,.1); border-color: rgba(239,83,80,.2); }
      .hero-lock {
        flex: 0 0 100px;
        width: 100px;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .hero-lock svg { width: 100%; height: 100%; filter: drop-shadow(0 6px 12px rgba(41,182,246,.35)); }

      .card {
        background: var(--card-bg);
        border-radius: 14px;
        padding: 16px;
        border: 1px solid var(--card-border);
        box-shadow: var(--card-shadow);
        margin-bottom: 14px;
      }
      .card.compact { padding: 14px 16px; }
      .card-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--primary);
        margin: 0 0 12px;
        padding-left: 10px;
        border-left: 3px solid var(--accent);
      }

      .status-card { display: flex; flex-direction: column; align-items: center; padding: 18px 16px 14px; }
      .status-stack { display: flex; flex-direction: column; align-items: center; gap: 10px; }
      .lock-status-below {
        font-size: 22px;
        font-weight: 700;
        color: var(--primary);
        line-height: 1.2;
        text-align: center;
        min-height: 28px;
      }
      .lock-status-below.charging { color: var(--accent-dark); }
      .lock-status-below.lock-done { color: var(--success); }
      .lock-status-below.err { color: var(--danger); }
      .charge-ring-wrap { position: relative; width: 150px; height: 150px; }
      .charge-ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
      .ring-bg { fill: none; stroke: #e3f2fd; stroke-width: 8; }
      .ring-fg {
        fill: none;
        stroke: var(--accent);
        stroke-width: 8;
        stroke-linecap: round;
        stroke-dasharray: 326.7;
        stroke-dashoffset: 326.7;
        transition: stroke-dashoffset .25s ease, stroke .25s ease;
      }
      .ring-fg.full { stroke: var(--success); }
      .charge-center {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        pointer-events: none;
      }
      .charge-percent { font-size: 32px; font-weight: 700; color: var(--accent-dark); line-height: 1; }
      .charge-percent.full { color: var(--success); }
      .charge-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

      .timing-total {
        font-size: 15px;
        font-weight: 700;
        color: var(--primary);
        padding: 10px 14px;
        background: linear-gradient(90deg, rgba(41,182,246,.1), rgba(41,182,246,.04));
        border-radius: 10px;
        border: 1px solid rgba(41,182,246,.15);
      }

      .menu-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 14px;
      }
      .menu-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 88px;
        padding: 14px 10px;
        border: 1px solid var(--card-border);
        border-radius: 14px;
        background: var(--card-bg);
        box-shadow: var(--card-shadow);
        cursor: pointer;
        transition: transform .15s ease, box-shadow .15s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .menu-item:active { transform: scale(.97); }
      .menu-item .menu-icon {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, rgba(41,182,246,.2), rgba(41,182,246,.08));
        color: var(--accent-dark);
      }
      .menu-item .menu-icon svg { width: 22px; height: 22px; }
      .menu-item .menu-label { font-size: 15px; font-weight: 600; color: var(--primary); }
      .menu-item.open .menu-icon { background: linear-gradient(135deg, rgba(38,166,154,.25), rgba(38,166,154,.1)); color: #00796b; }
      .menu-item.close .menu-icon { background: linear-gradient(135deg, rgba(255,167,38,.25), rgba(255,167,38,.1)); color: #e65100; }
      .menu-item.auto .menu-icon { background: linear-gradient(135deg, rgba(41,182,246,.3), rgba(2,136,209,.12)); }
      .menu-item.init .menu-icon { background: linear-gradient(135deg, rgba(107,138,173,.2), rgba(107,138,173,.08)); color: var(--primary-light); }

      .log-card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
      .log-actions { display: flex; gap: 8px; }
      .btn-sm {
        padding: 6px 12px;
        border: 0;
        border-radius: 8px;
        font-size: 13px;
        cursor: pointer;
        background: rgba(41,182,246,.12);
        color: var(--primary-light);
      }
      .btn-sm.secondary { background: rgba(107,138,173,.15); }
      .log {
        background: #1a3352;
        color: #b3d4f0;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 11px;
        padding: 12px;
        border-radius: 10px;
        max-height: 220px;
        overflow: auto;
        line-height: 1.5;
      }
      .log.collapsed { display: none; }

      .flow-overlay {
        position: fixed; inset: 0; z-index: 9999;
        display: none; align-items: center; justify-content: center;
        background: rgba(26, 77, 122, .45);
      }
      .flow-overlay.show { display: flex; }
      .flow-confirm-btn {
        min-width: 140px; min-height: 52px;
        padding: 14px 36px; border: 0; border-radius: 14px;
        background: linear-gradient(135deg, var(--success), #00897b);
        color: #fff; font-size: 18px; font-weight: 600; cursor: pointer;
        box-shadow: 0 8px 24px rgba(0,0,0,.2);
      }
      .flow-confirm-btn.err { background: linear-gradient(135deg, var(--danger), #c62828); }
    </style>
  </head>
  <body>
    <!-- 自动流程结束确认浮层：hideFlowBanner() 关闭 -->
    <div id="flowOverlay" class="flow-overlay">
      <button id="flowConfirmBtn" class="flow-confirm-btn" onclick="hideFlowBanner()">确认</button>
    </div>
    <div class="page">
      <header class="hero">
        <div class="hero-text">
          <p class="welcome">欢迎使用</p>
          <h1 class="app-name">聚如信</h1>
          <p class="app-sub">NFC 智能锁控制</p>
          <div class="status-chips">
            <span class="chip" id="env">未就绪</span>
            <span class="chip" id="plugin">未初始化</span>
          </div>
        </div>
        <div class="hero-lock" aria-hidden="true">
          <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="20" y="52" width="80" height="56" rx="10" fill="url(#lockBody)" stroke="#29b6f6" stroke-width="2"/>
            <path d="M36 52V38a24 24 0 0 1 48 0v14" stroke="#29b6f6" stroke-width="8" stroke-linecap="round" fill="none"/>
            <circle cx="60" cy="76" r="8" fill="#fff"/>
            <rect x="57" y="76" width="6" height="14" rx="2" fill="#fff"/>
            <defs>
              <linearGradient id="lockBody" x1="20" y1="52" x2="100" y2="108" gradientUnits="userSpaceOnUse">
                <stop stop-color="#4fc3f7"/>
                <stop offset="1" stop-color="#0288d1"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
      </header>

      <div class="card status-card">
        <div class="status-stack">
          <div class="charge-ring-wrap">
            <svg viewBox="0 0 120 120" aria-hidden="true">
              <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
              <circle id="chargeRingFg" class="ring-fg" cx="60" cy="60" r="52"></circle>
            </svg>
            <div class="charge-center">
              <div id="powerLevel" class="charge-percent">0%</div>
              <div class="charge-label">电量</div>
            </div>
          </div>
          <div id="unlockStatus" class="lock-status-below">-</div>
        </div>
      </div>

      <div class="card compact">
        <div class="card-title">总耗时</div>
        <div id="flowTotalMs" class="timing-total">总耗时: -</div>
      </div>

      <div class="menu-grid">
        <!-- openLock()：手动开锁 → NfcJrxUtil.openLock() -->
        <button type="button" class="menu-item open" onclick="openLock()">
          <span class="menu-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          </span>
          <span class="menu-label">开锁</span>
        </button>
        <!-- closeLock()：手动关锁 → NfcJrxUtil.closeLock() -->
        <button type="button" class="menu-item close" onclick="closeLock()">
          <span class="menu-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/><line x1="12" y1="15" x2="12" y2="18"/></svg>
          </span>
          <span class="menu-label">关锁</span>
        </button>
        <!-- autoToggleLock()：自动交替开/关 → NfcJrxUtil.autoToggleLock() -->
        <button type="button" class="menu-item auto" onclick="autoToggleLock()">
          <span class="menu-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v5h5M20 20v-5h-5"/><path d="M20 9A8 8 0 0 0 6.5 6.5L4 10M4 15a8 8 0 0 0 13.5 2.5L20 14"/></svg>
          </span>
          <span class="menu-label">自动开关锁</span>
        </button>
        <!-- initPlugin()：手动初始化 → NfcJrxUtil.ensureInitialized({ manual: true }) -->
        <button type="button" class="menu-item init" onclick="initPlugin()">
          <span class="menu-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          </span>
          <span class="menu-label">初始化</span>
        </button>
      </div>

      <div class="card">
        <div class="log-card-head">
          <div class="card-title" style="margin:0;border:0;padding:0;">调试日志</div>
          <div class="log-actions">
            <!-- toggleLogCollapse()：折叠/展开日志区 -->
            <button id="logToggleBtn" class="btn-sm" onclick="toggleLogCollapse()">展开</button>
            <!-- clearLog()：清空日志 -->
            <button class="btn-sm secondary" onclick="clearLog()">清空</button>
          </div>
        </div>
        <div id="log" class="log collapsed"></div>
      </div>
    </div>

    <!-- appConfig：NFC 超时/重试等配置；lockPermission：锁权限密码；nfcJrx：开/关锁 SDK -->
    <script src="resources/appConfig.js"></script>
    <script src="resources/lockPermission.js"></script>
    <script src="resources/nfcJrx.js"></script>
    <script>
      /**
       * =============================================================================
       * 聚如信演示页 — 开锁 / 关锁完整调用逻辑
       * =============================================================================
       *
       * 【分层】
       *   index.html（本文件）  → 只做 UI、按钮、日志、状态展示
       *   nfcJrx.js             → 业务编排 SDK（查 ID、密码、充电、电机）
       *   NFCLockPlugin.js      → Cordova 桥接 exec
       *   NFCLockPlugin.java    → 原生 NFC SDK（充电链式 WithLoop + 电机）
       *
       * 【启动阶段 — deviceready 一次】
       *   1. cordova.js 触发 deviceready → isReady = true，顶部显示「已就绪」
       *   2. NfcJrxUtil.setHooks({ log, onFlowPhase, onPower, onLockId, ... })
       *      把页面 UI 函数注册给 SDK，流程中由 SDK 回调更新界面
       *   3. LockPermission.applyConfig()  读取 appConfig 权限配置
       *   4. NfcJrxUtil.ensureInitialized()
       *      → ensureCordovaReady → plugin().init()
       *      → registerCallbackJrx() 监听原生异步回包
       *      → 顶部显示「已初始化」
       *
       * 【手动开锁 openLock() — 与关锁 closeLock() 仅 perType 不同】
       *
       *   用户点击「开锁」
       *        │
       *        ▼
       *   openLock()                          // HTML
       *        │
       *        ├─ beginFlowUI('open','manual') // 校验 deviceready、防重复点击
       *        │     · setMenuBusy(true)       // 禁用开/关/自动按钮
       *        │     · LockPermission.clearSessionCache()
       *        │     · setLockStatus('请贴卡开锁')
       *        │
       *        ▼
       *   NfcJrxUtil.openLock()               // nfcJrx.js → runLockFlow('open')
       *        │
       *        ├─ ① 查询锁 ID（贴卡，可重试）
       *        │     queryLockId() → plugin().queryLockId()
       *        │     回调 lockId → hooks.onLockId → log('锁ID: xxx')
       *        │     onFlowPhase('query_lock_id') → statusByPhase → UI「请贴卡读取锁ID」
       *        │
       *        ├─ ② 匹配锁密码（不读卡）
       *        │     LockPermission.fetchPassword(lockId) 或 appConfig 默认密码
       *        │     hooks.onPasswordReady → log('权限通过...')
       *        │     onFlowPhase('fetch_password') → UI「匹配权限中」
       *        │
       *        ├─ ③ 原生充电 + 电机（贴卡保持）
       *        │     plugin().runJsChargeAndMotor(lockId, pwd, 'open')
       *        │       → Java runJsChargeAndMotor → reqQueryPowerLevelWithLoop 链式轮询
       *        │       → 电量 < 100%：继续充电；= 100%：reqMotorForward
       *        │     jsChargePhase start/end → log 开始/结束充电、记录 chargeMs
       *        │     onFlowPhase('charging'/'motor') → UI「请保持贴卡」「开锁中」
       *        │     电机成功 → pendingMotorResolve → Promise resolve
       *        │
       *        ▼
       *   .then(onFlowSuccess)                 // HTML 成功收尾
       *        · setLockStatus('开锁成功')
       *        · renderChargeTotal(chargeMs)  // 充电结束 − 充电开始
       *        · setMenuBusy(false)
       *
       *   .catch(onFlowFail)                   // HTML 失败收尾
       *        · setLockStatus('失败')
       *        · log 错误信息
       *
       * 【手动关锁 closeLock()】
       *   与开锁相同，仅：
       *     beginFlowUI('close','manual')
       *     NfcJrxUtil.closeLock() → runLockFlow('close')
       *     runJsChargeAndMotor(..., 'close') → reqMotorReverse
       *     onFlowSuccess →「关锁成功」
       *
       * 【自动开关锁 autoToggleLock()】
       *   localStorage 计数偶数→开、奇数→关
       *   beginFlowUI(perType,'auto') → NfcJrxUtil.autoToggleLock()
       *   成功后 showFlowConfirm() 浮层确认
       *
       * 【总耗时 chargeMs】
       *   仅统计原生 NFC 充电：充电结束时间 − 充电开始时间（不含查 ID、密码、电机）
       *   电量已满时 chargeMs ≈ 0
       */

      /** 电量环周长（与 CSS stroke-dasharray 一致） */
      const RING_CIRC = 326.7;

      /** Cordova deviceready 是否已触发 */
      let isReady = false;
      /** 插件是否初始化成功（由 setHooks.setPluginInitialized 更新） */
      let isPluginInitialized = false;
      /** 最近一次锁状态 0=开 1=关 */
      let latestLockState = null;
      /** 当前流程模式 manual | auto */
      let flowMode = null;
      /** 当前流程动作 open | close */
      let flowAction = null;

      /** 格式化日志时间 HH:mm:ss.SSS */
      function formatLogTime(){
        const d=new Date();
        const p=(n)=>String(n).padStart(2,'0');
        const ms=String(d.getMilliseconds()).padStart(3,'0');
        return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}.${ms}`;
      }

      /** 追加一行调试日志到 #log，并同步 console */
      function log(msg, type='info'){
        const el=document.getElementById('log');
        if(!el) return;
        const line=document.createElement('div');
        line.textContent=`[${formatLogTime()}] ${msg}`;
        if(type==='error') line.style.color='#ff8a80';
        if(type==='success') line.style.color='#80cbc4';
        el.appendChild(line);
        el.scrollTop=el.scrollHeight;
        console.log(msg);
      }

      /** 清空 #log 内容 */
      function clearLog(){
        const el=document.getElementById('log');
        if(el){ el.innerHTML=''; }
        log('日志已清空');
      }

      /** 折叠或展开调试日志区域 */
      function toggleLogCollapse(){
        const el=document.getElementById('log');
        const btn=document.getElementById('logToggleBtn');
        if(!el || !btn) return;
        const collapsed=el.classList.toggle('collapsed');
        btn.textContent=collapsed ? '展开' : '折叠';
      }

      /** 毫秒转秒显示字符串 */
      function formatSec(ms){
        if(typeof ms !== 'number' || ms < 0) return '-';
        return (ms / 1000).toFixed(2) + ' s';
      }

      /** 重置「总耗时」卡片为占位符 */
      function resetStepTimingUI(){
        const total = document.getElementById('flowTotalMs');
        if(total){ total.textContent = '总耗时: -'; }
      }

      /** 更新「总耗时」卡片（充电结束 − 充电开始） */
      function renderChargeTotal(totalMs){
        const totalEl = document.getElementById('flowTotalMs');
        if(!totalEl) return;
        totalEl.textContent = '总耗时: ' + formatSec(totalMs);
      }

      /** 是否已有开/关锁流程在执行（委托 NfcJrxUtil.isFlowRunning） */
      function isFlowBusy(){
        return NfcJrxUtil.isFlowRunning();
      }

      /** 流程进行中禁用开锁/关锁/自动按钮，防止重复点击 */
      function setMenuBusy(busy){
        document.querySelectorAll('.menu-item.open,.menu-item.close,.menu-item.auto').forEach(function(btn){
          btn.disabled = !!busy;
          btn.style.opacity = busy ? '0.55' : '';
          btn.style.pointerEvents = busy ? 'none' : '';
        });
      }

      /**
       * NfcJrxUtil.setHooks.onFlowPhase 回调：按阶段更新中部状态文案
       * @param {string} phaseName query_lock_id | fetch_password | charging | motor
       */
      function statusByPhase(phaseName, detail){
        if(phaseName === 'query_lock_id') return setLockStatus('请贴卡读取锁ID', 'charging');
        if(phaseName === 'fetch_password') return setLockStatus('匹配权限中', 'charging');
        if(phaseName === 'charging') return setLockStatus('请保持贴卡', 'charging');
        if(phaseName === 'motor'){
          const act = detail && detail.action;
          setLockStatus(act === 'close' ? '关锁中' : '开锁中', 'charging');
        }
      }

      /** 更新电量环与百分比文字（NfcJrxUtil.setHooks.onPower） */
      function updateChargeRing(percent){
        const ring = document.getElementById('chargeRingFg');
        const label = document.getElementById('powerLevel');
        const safe = Math.max(0, Math.min(100, percent));
        if(ring){
          ring.style.strokeDashoffset = String(RING_CIRC * (1 - safe / 100));
          ring.classList.toggle('full', safe >= 100);
        }
        if(label){
          label.textContent = safe + '%';
          label.classList.toggle('full', safe >= 100);
        }
      }

      /**
       * 更新锁状态主文案 #unlockStatus
       * @param {string} text 显示文字
       * @param {string} [mode] charging | err 等 CSS 修饰类
       */
      function setLockStatus(text, mode){
        const el = document.getElementById('unlockStatus');
        if(!el) return;
        el.textContent = text || '-';
        if(text === '开锁成功' || text === '关锁成功'){
          el.className = 'lock-status-below lock-done';
          return;
        }
        el.className = 'lock-status-below' + (mode ? ' ' + mode : '');
      }

      /** 电机动作转成功提示文案 */
      function motorActionText(action){
        if(action === 'open') return '开锁成功';
        if(action === 'close') return '关锁成功';
        return '完成';
      }

      /**
       * 开/关锁流程成功收尾（NfcJrxUtil.openLock/closeLock/autoToggleLock 的 then）
       * @param {'manual'|'auto'} mode
       * @param {Object} result SDK 返回，含 motorAction、chargeMs
       */
      function onFlowSuccess(mode, result){
        const action = (result && result.motorAction) || flowAction;
        const chargeMs = result && typeof result.chargeMs === 'number' ? result.chargeMs : 0;
        flowMode = null;
        flowAction = null;
        setMenuBusy(false);
        if(action === 'open') latestLockState = '0';
        else if(action === 'close') latestLockState = '1';
        setLockStatus(motorActionText(action));
        renderChargeTotal(chargeMs);
        log((action === 'close' ? '关锁' : '开锁') + '流程完成，充电总耗时 ' + formatSec(chargeMs), 'success');
        resetPowerUIToZero();
        if(mode === 'auto') showFlowConfirm(false);
      }

      /**
       * 开/关锁流程失败收尾（SDK catch）
       * @param {'manual'|'auto'} mode
       */
      function onFlowFail(mode, err){
        flowMode = null;
        flowAction = null;
        setMenuBusy(false);
        setLockStatus('失败', 'err');
        log('流程失败: ' + (err && err.message ? err.message : err), 'error');
        if(mode === 'auto') showFlowConfirm(true);
      }

      /**
       * 点击开/关锁前：校验就绪、重置 UI、清权限缓存
       * @param {'open'|'close'} perType
       * @param {'manual'|'auto'} mode
       * @returns {boolean} 是否可继续调用 SDK
       */
      function beginFlowUI(perType, mode){
        if(!isReady){
          log('设备未就绪，请等待 deviceready', 'error');
          return false;
        }
        if(isFlowBusy()){ log('流程执行中，请稍后', 'error'); return false; }
        flowMode = mode;
        flowAction = perType;
        resetStepTimingUI();
        setMenuBusy(true);
        if(window.LockPermission) LockPermission.clearSessionCache();
        setLockStatus(perType === 'open' ? '请贴卡开锁' : '请贴卡关锁', 'charging');
        log((mode === 'auto' ? '自动' : '手动') + (perType === 'open' ? '开锁' : '关锁') + '：请先贴卡...');
        return true;
      }

      /** Cordova 就绪：注册 SDK 钩子并自动初始化插件 */
      document.addEventListener('deviceready', function(){
        isReady=true;
        log('deviceready');
        const env=document.getElementById('env');
        if(env){ env.textContent='已就绪'; env.className='chip ok'; }

        // 将页面 UI 函数注入 NfcJrxUtil，SDK 流程中回调更新界面
        NfcJrxUtil.setHooks({
          log: log,
          onFlowPhase: statusByPhase,
          onPower: function(percent, lockState){
            updateChargeRing(percent);
            if(lockState != null) latestLockState = lockState;
          },
          onLockId: function(lockId){ log('锁ID: ' + lockId, 'success'); },
          onPasswordReady: function(){ log('权限通过，锁密码已就绪', 'success'); },
          setPluginInitialized: function(ok){
            isPluginInitialized = !!ok;
            const pluginEl = document.getElementById('plugin');
            if(!pluginEl) return;
            pluginEl.textContent = ok ? '已初始化' : '失败';
            pluginEl.className = ok ? 'chip ok' : 'chip err';
          }
        });

        if(window.LockPermission) LockPermission.applyConfig();

        NfcJrxUtil.ensureInitialized().catch(function(err){
          log('自动初始化失败: ' + (err && err.message ? err.message : err), 'error');
        });
      }, false);

      /** 6 秒内未 deviceready 则提示 cordova / 插件加载问题 */
      setTimeout(function(){
        if(isReady) return;
        var hint = 'deviceready 超时：';
        if(typeof cordova === 'undefined'){
          hint += 'cordova.js 未加载（请安装 APK 运行，勿用浏览器直接打开 HTML）';
        } else if(!cordova.plugins || !cordova.plugins.NFCLockPlugin){
          hint += 'NFCLockPlugin 未找到（请执行 cordova prepare 后重新打包）';
        } else {
          hint += '设备未触发 deviceready，请检查插件与权限';
        }
        log(hint, 'error');
        const env=document.getElementById('env');
        if(env){ env.textContent='未就绪'; env.className='chip err'; }
      }, 6000);

      /** 菜单「初始化」：手动触发 NfcJrxUtil.ensureInitialized */
      function initPlugin(){
        if(!isReady){ log('设备未就绪，请等待 deviceready', 'error'); return; }
        NfcJrxUtil.ensureInitialized({ manual: true }).catch(function(err){
          log('初始化失败: ' + err, 'error');
        });
      }

      /** 菜单「开锁」：beginFlowUI → NfcJrxUtil.openLock */
      function openLock(){
        if(!beginFlowUI('open', 'manual')) return;
        NfcJrxUtil.openLock().then(function(r){ onFlowSuccess('manual', r); }).catch(function(e){ onFlowFail('manual', e); });
      }

      /** 菜单「关锁」：beginFlowUI → NfcJrxUtil.closeLock */
      function closeLock(){
        if(!beginFlowUI('close', 'manual')) return;
        NfcJrxUtil.closeLock().then(function(r){ onFlowSuccess('manual', r); }).catch(function(e){ onFlowFail('manual', e); });
      }

      /** 流程结束后电量环归零 */
      function resetPowerUIToZero(){
        updateChargeRing(0);
      }

      /** 自动流程结束显示确认浮层（成功绿/失败红） */
      function showFlowConfirm(isError){
        const overlay = document.getElementById('flowOverlay');
        const btn = document.getElementById('flowConfirmBtn');
        if(!overlay || !btn) return;
        btn.classList.toggle('err', !!isError);
        overlay.classList.add('show');
      }

      /** 关闭自动流程确认浮层（#flowConfirmBtn onclick） */
      function hideFlowBanner(){
        const overlay = document.getElementById('flowOverlay');
        if(overlay){ overlay.classList.remove('show'); }
      }

      /** 菜单「自动开关锁」：按 localStorage 计数交替开/关 → NfcJrxUtil.autoToggleLock */
      function autoToggleLock(){
        const perType = parseInt(localStorage.getItem('nfc_auto_toggle_count') || '0', 10) % 2 === 0 ? 'open' : 'close';
        if(!beginFlowUI(perType, 'auto')) return;
        NfcJrxUtil.autoToggleLock().then(function(r){ onFlowSuccess('auto', r); }).catch(function(e){ onFlowFail('auto', e); });
      }
    </script>
  </body>
</html>
