<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC 本地页面</title>
    <style>
      body { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; margin:0; padding:16px; background:#f7f7f9; }
      body.flow-active { padding-top: 96px; }
      .container { max-width: 720px; margin: 0 auto; }
      .card { background:#fff; border-radius:12px; padding:16px; box-shadow:0 2px 10px rgba(0,0,0,.06); margin-bottom:16px; }
      .title { font-size:18px; font-weight:600; margin-bottom:12px; }
      .row { display:flex; gap:12px; flex-wrap:wrap; }
      .row .col { flex:1; min-width:220px; }
      label { display:block; font-size:13px; color:#555; margin-bottom:6px; }
      input { width:100%; padding:10px 12px; border:1px solid #ddd; border-radius:8px; font-size:14px; }
      .btn { padding:10px 14px; border:0; border-radius:8px; background:#007bff; color:#fff; cursor:pointer; font-size:14px; }
      .btn.warn { background:#ffc107; color:#333; }
      .btn.success { background:#28a745; }
      .status { padding:8px 10px; background:#f8f9fa; border:1px solid #eee; border-radius:8px; font-size:13px; color:#333; }
      .log { background:#0f172a; color:#e2e8f0; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; padding:12px; border-radius:8px; max-height:260px; overflow:auto; }
      .badge { display:inline-block; padding:4px 8px; border-radius:999px; font-size:12px; margin-left:8px; }
      .badge.ok { background:#d1fae5; color:#065f46; }
      .badge.err { background:#fee2e2; color:#991b1b; }
      .progress-wrap { margin-top:12px; }
      .progress-label { font-size:12px; color:#555; margin-bottom:6px; }
      .progress-bar { width:100%; height:10px; background:#e9ecef; border-radius:999px; overflow:hidden; }
      .progress-fill { height:100%; width:0%; background:#007bff; transition:width .25s ease; }
      .flow-banner { position:fixed; left:12px; right:12px; top:12px; z-index:9999; background:#ffeb3b; border:1px solid #d4b200; border-radius:12px; box-shadow:0 8px 20px rgba(0,0,0,.12); padding:10px 12px; display:none; }
      .flow-banner.show { display:block; }
      .flow-banner.running { border-color:#d4b200; }
      .flow-banner.success { border-color:#d4b200; }
      .flow-banner.error { border-color:#d4b200; }
      .flow-row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
      .flow-text { font-size:13px; color:#111; }
      .flow-ok { background:#16a34a; color:#fff; border:0; border-radius:8px; padding:7px 12px; font-size:12px; cursor:pointer; display:none; }
    </style>
    <!-- 直接从应用本地资源加载 Cordova 脚本 -->
    <script src="../cordova.js"></script>
    <script src="../cordova_plugins.js"></script>
    <script>
      function log(msg, type='info'){ const el=document.getElementById('log'); const line=document.createElement('div'); const ts=new Date().toLocaleTimeString(); line.textContent=`[${ts}] ${msg}`; if(type==='error') line.style.color='#fca5a5'; if(type==='success') line.style.color='#86efac'; el.appendChild(line); el.scrollTop=el.scrollHeight; console.log(msg); }

      let isReady=false, isPluginInitialized=false;
      let latestLockState = null;
      let autoRunning = false;
      let pendingQueryLockIdResolve = null;
      let pendingQueryLockPasswordResolve = null;
      let pendingQueryPowerResolve = null;
      let pendingMotorResolve = null;
      let autoProgressTotal = 4;
      let latestLockId = '';
      let latestLockPassword = '';
      let latestStateAt = 0;
      let latestPowerLevel = -1;

      function setAutoProgress(step, text, isError){
        const safeStep = Math.max(0, Math.min(step, autoProgressTotal));
        const percent = Math.round((safeStep / autoProgressTotal) * 100);
        const fill = document.getElementById('autoProgressFill');
        const label = document.getElementById('autoProgressText');
        if(fill){ fill.style.width = percent + '%'; fill.style.background = isError ? '#dc3545' : '#007bff'; }
        if(label){ label.textContent = (text || '待开始') + '（' + percent + '%）'; }
        if(text){ updateFlowBanner(text, isError ? 'error' : 'running', false); }
      }

      function waitUntil(conditionFn, timeoutMs){
        return new Promise((resolve, reject) => {
          const start = Date.now();
          const timer = setInterval(() => {
            if(conditionFn()){
              clearInterval(timer);
              resolve(true);
              return;
            }
            if(Date.now() - start > timeoutMs){
              clearInterval(timer);
              reject(new Error('超时，请将NFC卡靠近设备后重试'));
            }
          }, 180);
        });
      }

      document.addEventListener('deviceready', function(){
        isReady=true; log('deviceready');
        const env=document.getElementById('env'); if(env){ env.textContent='已就绪'; env.className='badge ok'; }
      }, false);

      function ensureReady(){
        if(!isReady){ log('设备未就绪，请等待 deviceready', 'error'); return false; }
        if(typeof cordova==='undefined'){ log('cordova 未注入（cordova.js 未加载成功）', 'error'); return false; }
        if(!cordova.plugins || !cordova.plugins.NFCLockPlugin){ log('NFCLockPlugin 未找到（检查 cordova_plugins.js 与 plugins 目录）', 'error'); return false; }
        return true;
      }

      function initPlugin(){
        if(!ensureReady()) return;
        log('初始化插件...');
        cordova.plugins.NFCLockPlugin.init(function(res){
          isPluginInitialized=true;
          document.getElementById('plugin').textContent='已初始化';
          document.getElementById('plugin').className='badge ok';
          log('插件初始化成功: '+res, 'success');
          registerCallback();
        }, function(err){
          document.getElementById('plugin').textContent='失败';
          document.getElementById('plugin').className='badge err';
          log('插件初始化失败: '+err, 'error');
        });
      }

      function registerCallback(){
        cordova.plugins.NFCLockPlugin.registerCallback(function(result){
          log('收到回调: '+JSON.stringify(result));
          if(result && result.type==='autoFlowProgress'){
            const step = Number(result.step || 0);
            const msg = result.message || '自动流程进行中';
            setAutoProgress(step, msg, result.status === 'error');
            if(msg.indexOf('充电') >= 0){
              updateFlowBanner(msg, 'running', false);
            }
            return;
          }
          if(result && result.type==='autoFlowComplete'){
            autoRunning = false;
            if(result.success){
              if(result.lockId){
                latestLockId = String(result.lockId);
                document.getElementById('displayLockId').value = latestLockId;
              }
              if(result.lockPassword){
                latestLockPassword = String(result.lockPassword);
                document.getElementById('displayPassword').value = latestLockPassword;
              }
              if(result.motorAction === 'open'){
                latestLockState = '0';
                const statusEl = document.getElementById('unlockStatus');
                if(statusEl){ statusEl.textContent = '已开锁'; statusEl.style.color = '#16a34a'; }
              } else if(result.motorAction === 'close'){
                latestLockState = '2';
                const statusEl = document.getElementById('unlockStatus');
                if(statusEl){ statusEl.textContent = '已关锁'; statusEl.style.color = '#16a34a'; }
              }
              log('自动流程完成', 'success');
              setAutoProgress(4, '自动流程完成', false);
              resetPowerUIToZero();
              updateFlowBanner('开锁/关锁流程已完成，请点击确认。', 'success', true);
            } else {
              log('自动流程失败: ' + (result.message || '未知错误'), 'error');
              setAutoProgress(0, '自动流程失败', true);
              updateFlowBanner(result.message || '请重新尝试自动开锁或关锁。', 'error', true);
            }
            return;
          }
          const respType = normalizeRespType(result);
          const isQueryIdResp = !!(result && (result.type==='queryLockId' || respType === 'RESP_QUERY_LOCK_ID'));
          const isQueryPwdResp = !!(result && (result.type==='queryLockPassword' || respType === 'RESP_QUERY_LOCK_PWD'));
          if(result && result.lockId){
            const id = String(result.lockId).trim();
            if(id){
              latestLockId = id;
              document.getElementById('displayLockId').value = id;
            }
          }
          if((isQueryIdResp || (result && result.lockId)) && pendingQueryLockIdResolve){ pendingQueryLockIdResolve(result || {}); pendingQueryLockIdResolve = null; }
          if(isQueryPwdResp && result && result.lockPassword){
            latestLockPassword = String(result.lockPassword).trim();
            document.getElementById('displayPassword').value=latestLockPassword;
          }
          if(isQueryPwdResp && pendingQueryLockPasswordResolve){ pendingQueryLockPasswordResolve(result || {}); pendingQueryLockPasswordResolve = null; }
          if(result && result.type==='queryPowerLevel' && result.powerLevel!=null){
            const p=document.getElementById('powerLevel');
            if(p){ p.textContent = result.powerLevel + '%'; }
            latestLockState = result.lockState;
            updateLockStateCodeUI(result.lockState);
            latestPowerLevel = Number(result.powerLevel);
            latestStateAt = Date.now();
            updateLockStateUI(parseLockState(result.lockState));
            log('当前电量: '+ result.powerLevel + '%', 'success');
            if(pendingQueryPowerResolve){ pendingQueryPowerResolve(result); pendingQueryPowerResolve = null; }
          }
          if(result && (result.type==='motorForward' || result.motorForwardSuccess!==undefined)){
            const statusEl = document.getElementById('unlockStatus');
            statusEl.textContent = result.motorForwardSuccess ? '已开锁' : '开锁失败';
            statusEl.style.color = result.motorForwardSuccess ? '#16a34a' : '#dc2626';
            if(result.motorForwardSuccess){
              latestLockState = '0';
              resetPowerUIToZero();
            } else {
              updateFlowBanner('开锁失败，请重新尝试自动开锁或关锁。', 'error', true);
            }
            if(pendingMotorResolve){ pendingMotorResolve({ ok: !!result.motorForwardSuccess, action: 'open', result }); pendingMotorResolve = null; }
          }
          if(result && (result.type==='motorReverse' || result.motorReverseSuccess!==undefined)){
            const statusEl = document.getElementById('unlockStatus');
            statusEl.textContent = result.motorReverseSuccess ? '已关锁' : '关锁失败';
            statusEl.style.color = result.motorReverseSuccess ? '#16a34a' : '#dc2626';
            if(result.motorReverseSuccess){
              latestLockState = '2';
              resetPowerUIToZero();
            } else {
              updateFlowBanner('关锁失败，请重新尝试自动开锁或关锁。', 'error', true);
            }
            if(pendingMotorResolve){ pendingMotorResolve({ ok: !!result.motorReverseSuccess, action: 'close', result }); pendingMotorResolve = null; }
          }
        }, function(error){ log('回调错误: '+JSON.stringify(error), 'error'); });
      }

      function queryLockId(){ if(!ensureReady()||!isPluginInitialized){ log('请先初始化插件', 'error'); return; } log('查询锁ID...'); cordova.plugins.NFCLockPlugin.queryLockId(function(ok){ log('查询锁ID请求已发送: '+ok, 'success'); }, function(err){ log('查询锁ID失败: '+err, 'error'); }); }
      function queryLockPassword(){ if(!ensureReady()||!isPluginInitialized){ log('请先初始化插件', 'error'); return; } log('查询锁密码...'); cordova.plugins.NFCLockPlugin.queryLockPassword(function(ok){ log('查询锁密码请求已发送: '+ok, 'success'); }, function(err){ log('查询锁密码失败: '+err, 'error'); }); }
      function queryLockStatusWithCredential(lockId, lockPassword){
        if(!ensureReady()||!isPluginInitialized){ log('请先初始化插件', 'error'); return; }
        cordova.plugins.NFCLockPlugin.queryLockStatus(
          lockId,
          lockPassword,
          function(ok){ log('查询状态请求已发送: '+ok, 'success'); },
          function(err){ log('查询状态失败: '+err, 'error'); }
        );
      }
      function openLock(){ if(!ensureReady()||!isPluginInitialized){ log('请先初始化插件', 'error'); return; } const id=document.getElementById('displayLockId').value.trim(); const pwd=document.getElementById('displayPassword').value.trim(); if(!id||!pwd){ log('请先查询或填写锁ID/密码', 'error'); return; }
        log('发送开锁...'); cordova.plugins.NFCLockPlugin.motorForward(id, pwd, function(ok){ log('开锁指令已发送: '+ok, 'success'); }, function(err){ log('开锁失败: '+err, 'error'); }); }
      function closeLock(){ if(!ensureReady()||!isPluginInitialized){ log('请先初始化插件', 'error'); return; } const id=document.getElementById('displayLockId').value.trim(); const pwd=document.getElementById('displayPassword').value.trim(); if(!id||!pwd){ log('请先查询或填写锁ID/密码', 'error'); return; }
        log('发送关锁...'); cordova.plugins.NFCLockPlugin.motorReverse(id, pwd, function(ok){ log('关锁指令已发送: '+ok, 'success'); }, function(err){ log('关锁失败: '+err, 'error'); }); }

      function withTimeout(ms, executor){
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => reject(new Error('超时，请将NFC卡靠近设备后重试')), ms);
          executor((value) => { clearTimeout(timer); resolve(value); });
        });
      }

      function sleep(ms){
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      async function runStepWithRetry(stepText, attempts, timeoutMs, fireCommand, pendingSetter, resultValidator){
        let lastErr = null;
        for(let i = 1; i <= attempts; i++){
          try{
            if(i > 1){
              log(stepText + ' 第' + i + '次重试...');
              await sleep(200);
            }
            keepCardHint(stepText);
            const result = await withTimeout(timeoutMs, (resolve) => {
              pendingSetter(resolve);
              fireCommand();
            });
            if(resultValidator && !resultValidator(result)){
              throw new Error(stepText + ' 回包无效');
            }
            return result;
          } catch (e){
            lastErr = e;
            pendingSetter(null);
          }
        }
        showUserPrompt(stepText + '卡住，请将手机贴在锁上保持10秒，等待完成。');
        throw lastErr || new Error(stepText + ' 失败');
      }

      async function runMotorActionWithRetry(actionName, fireCommand){
        let lastErr = null;
        for(let i = 1; i <= 4; i++){
          try{
            if(i > 1){
              log(actionName + ' 第' + i + '次重试（无需手动再点）...');
              await sleep(200);
            }
            keepCardHint('当前正在执行' + actionName);
            // 重试节奏控制：单次等待+间隔控制在约1.3s内
            await withTimeout(1100, (resolve) => {
              pendingMotorResolve = resolve;
              fireCommand();
            });
            return true;
          } catch (e){
            lastErr = e;
            pendingMotorResolve = null;
          }
        }
        showUserPrompt(actionName + '步骤卡住，请将手机贴在锁上保持10秒，等待完成开锁或关锁。');
        throw lastErr || new Error(actionName + ' 执行失败');
      }

      function parseLockState(state){
        if(state===null || state===undefined) return 'unknown';
        const raw = String(state).toLowerCase();
        // 根据最新实测修正：2=开锁，0=关锁（1 保持关锁兜底）
        if(raw==='2' || raw==='open' || raw==='opened' || raw==='unlock' || raw==='unlocked' || raw.includes('开')) return 'opened';
        if(raw==='0' || raw==='1' || raw==='close' || raw==='closed' || raw==='lock' || raw==='locked' || raw.includes('关')) return 'closed';
        return 'unknown';
      }

      function updateLockStateUI(state){
        const statusEl = document.getElementById('unlockStatus');
        if(!statusEl) return;
        if(state === 'opened'){
          statusEl.textContent = '已开锁';
        } else if(state === 'closed'){
          statusEl.textContent = '已关锁';
        }
      }

      function updateLockStateCodeUI(code){
        const codeEl = document.getElementById('lockStateCode');
        if(codeEl){ codeEl.textContent = code == null ? '-' : String(code); }
      }

      function resetPowerUIToZero(){
        latestPowerLevel = 0;
        const p = document.getElementById('powerLevel');
        if(p){ p.textContent = '0%'; }
      }

      function showUserPrompt(message){
        updateFlowBanner(message, 'error', true);
      }

      function updateFlowBanner(message, status, showConfirm){
        const banner = document.getElementById('flowBanner');
        const text = document.getElementById('flowBannerText');
        const ok = document.getElementById('flowBannerOk');
        if(!banner || !text || !ok) return;
        banner.classList.add('show');
        document.body.classList.add('flow-active');
        banner.classList.remove('running', 'success', 'error');
        banner.classList.add(status || 'running');
        text.textContent = message || '';
        ok.style.display = showConfirm ? 'inline-block' : 'none';
      }

      function hideFlowBanner(){
        const banner = document.getElementById('flowBanner');
        if(banner){ banner.classList.remove('show', 'running', 'success', 'error'); }
        document.body.classList.remove('flow-active');
      }

      function keepCardHint(stepText){
        updateFlowBanner(stepText + '，请保持贴卡。', 'running', false);
      }

      function normalizeRespType(result){
        if(!result || !result.respCmdType) return '';
        return String(result.respCmdType);
      }

      async function autoToggleLock(){
        if(autoRunning){ log('自动流程执行中，请稍后', 'error'); return; }
        if(!ensureReady() || !isPluginInitialized){ log('请先初始化插件', 'error'); return; }
        autoRunning = true;
        updateFlowBanner('自动开锁或关锁流程开始，请将手机贴在锁上并保持。', 'running', false);
        setAutoProgress(0, '自动流程开始', false);
        log('开始原生自动流程：一次贴卡串联 ID -> 密码 -> 状态 -> 充电 -> 电机');
        const startAuto = cordova.plugins.NFCLockPlugin.autoToggleLock
          ? cordova.plugins.NFCLockPlugin.autoToggleLock.bind(cordova.plugins.NFCLockPlugin)
          : function(success, error){ cordova.exec(success, error, 'NFCLockPlugin', 'autoToggleLock', []); };
        startAuto(
          function(res){ log('自动流程已启动: ' + res, 'success'); },
          function(err){
            autoRunning = false;
            log('自动流程启动失败: ' + err, 'error');
            setAutoProgress(0, '自动流程失败', true);
            updateFlowBanner('流程执行中断，请重新尝试自动开锁或关锁。', 'error', true);
          }
        );
      }
    </script>
  </head>
  <body>
    <div id="flowBanner" class="flow-banner">
      <div class="flow-row">
        <div id="flowBannerText" class="flow-text">自动流程状态</div>
        <button id="flowBannerOk" class="flow-ok" onclick="hideFlowBanner()">确认完成</button>
      </div>
    </div>
    <div class="container">
      <div class="card">
        <div class="title">环境状态</div>
        <div>设备状态：<span id="env" class="badge err">未就绪</span></div>
        <div style="margin-top:8px;">插件状态：<span id="plugin" class="badge err">未初始化</span></div>
        <div style="margin-top:12px;" class="row">
          <button class="btn" onclick="initPlugin()">初始化插件</button>
        </div>
      </div>

      <div class="card">
        <div class="title">查询</div>
        <div class="row">
          <div class="col">
            <label>锁ID</label>
            <input id="displayLockId" placeholder="点击按钮后自动填充或手动输入" />
          </div>
          <div class="col">
            <label>锁密码</label>
            <input id="displayPassword" placeholder="点击按钮后自动填充或手动输入" />
          </div>
        </div>
        <div class="row" style="margin-top:12px;">
          <button class="btn" onclick="queryLockId()">查询锁ID</button>
          <button class="btn" onclick="queryLockPassword()">查询锁密码</button>
        </div>
      </div>

      <div class="card">
        <div class="title">开关锁控制</div>
        <div class="row">
          <button class="btn success" onclick="openLock()">开锁</button>
          <button class="btn warn" onclick="closeLock()">关锁</button>
          <button class="btn" onclick="autoToggleLock()">自动开锁或关锁</button>
        </div>
        <div style="margin-top:12px;" class="status">状态：<span id="unlockStatus">-</span></div>
        <div style="margin-top:8px;" class="status">状态码：<span id="lockStateCode">-</span></div>
        <div style="margin-top:8px;" class="status">电量：<span id="powerLevel">-</span></div>
        <div class="progress-wrap">
          <div id="autoProgressText" class="progress-label">待开始（0%）</div>
          <div class="progress-bar"><div id="autoProgressFill" class="progress-fill"></div></div>
        </div>
      </div>

      <div class="card">
        <div class="title">调试日志</div>
        <div id="log" class="log"></div>
      </div>
    </div>
  </body>
  </html>
